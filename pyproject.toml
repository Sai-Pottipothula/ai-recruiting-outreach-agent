[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wynisco-outreach-agent"
version = "1.0.0"
description = "AI-powered outreach agent built with LangGraph, MCP, Tavily, and OpenAI."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "langgraph",
    "langchain",
    "langchain-openai",
    "openai",
    "mcp",
    "fastmcp",
    "tavily-python",
    "python-dotenv",
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "rich",
    "pytest",
    "langsmith",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["src*"]